services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ${HOST_WORKSPACE_FOLDER:-.}/backend:/app/backend
      - ${HOST_WORKSPACE_FOLDER:-.}/pyproject.toml:/app/pyproject.toml:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ${HOST_WORKSPACE_FOLDER:-.}/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
