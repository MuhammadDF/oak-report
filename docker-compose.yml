services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER is required} -d ${DB_NAME:?DB_NAME is required}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    command: >-
      sh -c "uv run alembic upgrade head && uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      DATA_PROVIDER: ${DATA_PROVIDER:?DATA_PROVIDER is required}
      DATABASE_URL: ${APP_DATABASE_URL:-}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_HOST: ${DB_HOST:?DB_HOST is required}
      POSTGRES_PORT: ${DB_PORT:?DB_PORT is required}
    ports:
      - "8000:8000"
    volumes:
      - ${HOST_WORKSPACE_FOLDER:-.}/backend:/app/backend
      - ${HOST_WORKSPACE_FOLDER:-.}/pyproject.toml:/app/pyproject.toml:ro
      - ${HOST_WORKSPACE_FOLDER:-.}/alembic:/app/alembic
      - ${HOST_WORKSPACE_FOLDER:-.}/alembic.ini:/app/alembic.ini:ro
      - ${HOST_WORKSPACE_FOLDER:-.}/data:/app/data:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      VITE_DATA_PROVIDER: ${VITE_DATA_PROVIDER:-api}
    ports:
      - "5173:5173"
    volumes:
      - ${HOST_WORKSPACE_FOLDER:-.}/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
  postgres_data:
