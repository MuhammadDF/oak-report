services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      DATA_PROVIDER: ${DATA_PROVIDER:-mock}
    ports:
      - "8000:8000"
    volumes:
      - ${HOST_WORKSPACE_FOLDER:-.}/backend:/app/backend
      - ${HOST_WORKSPACE_FOLDER:-.}/pyproject.toml:/app/pyproject.toml:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      VITE_DATA_PROVIDER: ${VITE_DATA_PROVIDER:-api}
    ports:
      - "5173:5173"
    volumes:
      - ${HOST_WORKSPACE_FOLDER:-.}/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
