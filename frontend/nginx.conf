server {
  listen       ${PORT};
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # SPA fallback — serve index.html for any unmatched route so client-side
  # routing (React Router) works on direct URL access / refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
