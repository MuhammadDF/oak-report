name: Deploy backend

on:
  push:
    branches: [main, cicd/cloudrun]
    paths:
      - "backend/**"
      - "alembic/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - "data/**"
      - "backend.Dockerfile"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-backend-main
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}/backend
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker auth
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            --platform linux/amd64 \
            -f backend.Dockerfile \
            -t "$IMAGE:sha-$GITHUB_SHA" \
            -t "$IMAGE:latest" \
            .

      - name: Push image
        run: docker push "$IMAGE" --all-tags

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ vars.BACKEND_SERVICE }}" \
            --image="$IMAGE:sha-$GITHUB_SHA" \
            --region="${{ vars.GCP_REGION }}"
